name: test
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y swig libseccomp2
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - run: python -m compileall -q common marl-ppo dpo-llm scripts
